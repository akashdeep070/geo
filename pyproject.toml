[project]
name = "geospatial-measurement-api"
version = "0.1.0"
description = "Measure uploaded Shapefile and KML features using projected coordinates"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pyshp>=3.1,<4",
  "shapely>=2.1,<3",
  "pyproj>=3.7,<4",
  "defusedxml>=0.7.1,<1",
  "numpy>=2,<3",
  "pydantic>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "certifi>=2025.1.31",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "fiona>=1.10,<2"]
browser = ["playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.fastapi.static]
cdn = false
