name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: geo_tests
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d geo_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GEO_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/geo_tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked --group browser
      - run: uv run --locked python scripts/build_frontend.py --check
      - run: uv run --locked --group browser playwright install --with-deps chromium
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q
      - run: uv run --locked --group browser python scripts/browser_smoke.py
      - run: uv run --locked --group browser python scripts/browser_smoke.py
        env:
          VERCEL: "1"
          GEO_STORAGE_MODE: none
      - run: uv run --locked --group browser python scripts/browser_smoke.py
        env:
          VERCEL: "1"
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/geo_tests
      - run: uv run --locked python scripts/package_deployment.py
      - uses: actions/upload-artifact@v4
        with:
          name: geo-vercel-source
          path: dist/geo-vercel.zip
          if-no-files-found: error
